[package]
name = "bb-app"
description = "BlackBox HFT application: HTTP API /api/v1, in-process job worker, run pipeline and the `blackbox` command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bb_app"
path = "src/lib.rs"

[[bin]]
name = "blackbox"
path = "src/main.rs"

[dependencies]
bb-core = { workspace = true, features = ["openapi"] }
bb-data.workspace = true
bb-strategies.workspace = true
bb-sim.workspace = true
bb-forensics.workspace = true
bb-db.workspace = true
bb-artifacts.workspace = true
bb-analytics = { workspace = true, features = ["openapi"] }
serde.workspace = true
# `float_roundtrip`: stored runs are read back from JSON and must reproduce every f64 exactly,
# otherwise a reloaded run would no longer match its own `result_sha256`. serde_json's default
# float parser is allowed to be off by one unit in the last place.
serde_json = { workspace = true, features = ["float_roundtrip"] }
anyhow.workspace = true
thiserror.workspace = true
# Gzip for report and export payloads; sha2/hex for content hashes.
flate2.workspace = true
sha2.workspace = true
hex.workspace = true
uuid = { workspace = true, features = ["v7"] }
base64.workspace = true
chrono.workspace = true
bytes.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
axum.workspace = true
tokio = { workspace = true }
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
governor.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { workspace = true }
rustls.workspace = true
