name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: blackbox-local
          POSTGRES_DB: blackbox_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox -d blackbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLACKBOX_TEST_DATABASE_URL: postgres://blackbox:blackbox-local@127.0.0.1:55432/blackbox_test
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        # Includes the determinism tests, the pinned upstream-engine defect tests, the
        # linux-x86_64 golden pins and the hosted peak-memory check (VmHWM < 300 MB).
        run: cargo test --workspace --locked -- --nocapture
      - name: Determinism across processes
        # The same preset simulated in two separate processes must give the same result hash.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cargo run --release --locked --bin blackbox -- --data-dir "$tmp" synth
          # Precision (AT-9): no JSON number in the dataset manifest beyond 2^53 - 1.
          unsafe=$(jq '[.. | numbers | select(. > 9007199254740991 or . < -9007199254740991)] | length' "$tmp"/datasets/*/dataset.json)
          echo "manifest numbers beyond 2^53 - 1: $unsafe"
          test "$unsafe" = 0
          a=$(cargo run --release --locked --bin blackbox -- --data-dir "$tmp" run --preset maker_baseline | grep '^result sha256')
          rm -rf "$tmp/runs"
          b=$(cargo run --release --locked --bin blackbox -- --data-dir "$tmp" run --preset maker_baseline | grep '^result sha256')
          echo "$a"; echo "$b"
          test -n "$a" && test "$a" = "$b"

  golden-windows:
    # Platform policy (docs/EXPERIMENT_REPRODUCIBILITY.md): linux-x86_64 is canonical; the
    # windows-x86_64-gnu pins in golden.rs are checked here with the GNU toolchain and the
    # runner's preinstalled MinGW-w64 GCC, the setup docs/BUILDING.md documents.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GNU toolchain
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          gcc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Golden results (windows-x86_64-gnu pins)
        run: cargo test --locked -p bb-app --test golden
      - name: Hosted peak memory (Windows peak working set)
        run: cargo test --locked -p bb-app --test hosted_peak_memory -- --nocapture

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: npm audit (SEC-21)
        # Production dependencies only: a high or critical advisory fails; registry signatures and
        # provenance attestations of every installed package must verify.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit signatures
      - run: npm run build
      - name: Secret scan of the bundle (SEC-19)
        working-directory: .
        run: bash scripts/ci/secret-scan.sh dist web/dist

  policy:
    # Supply-chain and source-policy gates (SECURITY_REVIEW SEC-19, SEC-21, SEC-24, SEC-30).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan reads every commit of the push or pull request.
          fetch-depth: 0
      - name: Actions SHA-pinned, base images digest-pinned (SEC-21)
        run: bash scripts/ci/check-pins.sh
      - name: Secret scan of the repository and the new commits (SEC-19)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no `before` (all zeros): the tracked-file scan still runs.
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bash scripts/ci/secret-scan.sh repo "$BASE"
          else
            bash scripts/ci/secret-scan.sh repo
          fi
      - name: No process spawn or dynamic loading, SQL only from literals (SEC-24, SEC-30)
        run: bash scripts/ci/code-policy.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: cargo-deny (advisories, bans, licences, sources; deny.toml)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          tarball="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$tarball"
          echo "$DENY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/cargo-deny" --locked check
      - name: Engine built without its live feature (SEC-21)
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked --target all -e features -i hftbacktest)
          if grep -q 'hftbacktest feature "live"' <<<"$tree"; then
            echo "::error::hftbacktest is built with its live (exchange connectivity) feature"
            exit 1
          fi

  contract:
    # AT-14: web/openapi.json and web/src/api/v1.gen.ts are regenerated and must not change.
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build simulator
        run: cargo build --locked -p bb-app --bin blackbox
      - run: npm ci
        working-directory: web
      - name: Contract drift
        run: bash scripts/ci/check-contract.sh target/debug/blackbox

  audit:
    # RustSec advisory database check of Cargo.lock.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accepted, with evidence (docs/SECURITY.md, "Dependency advisories"):
          # - RUSTSEC-2026-0367/0368/0369/0429: zip 6.x extraction APIs (`ZipArchive::extract`,
          #   `ZipStreamReader::extract`). Fixed only in zip 9, but hftbacktest 0.9.4 requires
          #   zip ^6. Neither the engine nor BlackBox calls any extraction API: archives are
          #   opened with `ZipArchive::new` + `by_name` and written with `ZipWriter`, and
          #   BlackBox only reads archives it wrote, after checking their SHA-256.
          # - RUSTSEC-2025-0141: bincode unmaintained (an engine dependency); informational,
          #   no known vulnerability.
          # - RUSTSEC-2026-0459: libsqlite3-sys (C SQLite). Present in Cargo.lock only as an
          #   optional dependency of sqlx-sqlite; sqlx is built with the `postgres` driver only and
          #   `cargo tree -i libsqlite3-sys --target all -e all` prints nothing: never compiled.
          ignore: RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0429,RUSTSEC-2025-0141,RUSTSEC-2026-0459

  docker:
    # The image must build: it is the documented way to run the full simulator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t blackbox-hft:ci .
      - name: Serve and answer
        run: |
          set -euo pipefail
          docker run -d --name bb -p 127.0.0.1:8787:8787 blackbox-hft:ci
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/api/datasets | grep -q synthetic-demo
          docker logs bb | tail -5

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: blackbox-local
          POSTGRES_DB: blackbox_e2e_ui
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox -d blackbox_e2e_ui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: 6
      # Read by web/e2e/serve.mjs (paths relative to the repository root).
      BLACKBOX_BIN: target/release/blackbox
      DATABASE_URL: postgres://blackbox:blackbox-local@127.0.0.1:55432/blackbox_e2e_ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build simulator
        run: cargo build --release --locked -p bb-app --bin blackbox
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Synthetic research story
        run: npm run test:e2e -- --project=chromium
        working-directory: web
      - name: Upload failed browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
