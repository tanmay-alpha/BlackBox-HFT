[workspace]
resolver = "3"
# Listed explicitly so a half-written crate never breaks the whole workspace.
members = ["crates/bb-core", "crates/bb-data", "crates/bb-sim", "crates/bb-strategies", "crates/bb-forensics", "crates/bb-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/tanmay-alpha/BlackBox-HFT"

[workspace.dependencies]
# Simulation engine. Exact pin: the adapter relies on 0.9.4 internals that were
# read and verified (see docs/EXECUTION_MODEL.md). Only the backtest feature is used;
# `live` (exchange connectivity) is deliberately disabled.
hftbacktest = { version = "=0.9.4", default-features = false, features = ["backtest"] }

bb-core = { path = "crates/bb-core" }
bb-data = { path = "crates/bb-data" }
bb-strategies = { path = "crates/bb-strategies" }
bb-sim = { path = "crates/bb-sim" }
bb-forensics = { path = "crates/bb-forensics" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
zip = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
