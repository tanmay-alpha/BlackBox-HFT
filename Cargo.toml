[workspace]
resolver = "3"
# Listed explicitly so a half-written crate never breaks the whole workspace.
members = ["crates/bb-core", "crates/bb-data", "crates/bb-sim", "crates/bb-strategies", "crates/bb-forensics", "crates/bb-app", "crates/bb-db", "crates/bb-artifacts", "crates/bb-analytics"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/tanmay-alpha/BlackBox-HFT"

[workspace.dependencies]
# Simulation engine. Exact pin: the adapter relies on 0.9.4 internals that were
# read and verified (see docs/EXECUTION_MODEL.md). Only the backtest feature is used;
# `live` (exchange connectivity) is deliberately disabled.
hftbacktest = { version = "=0.9.4", default-features = false, features = ["backtest"] }

bb-core = { path = "crates/bb-core" }
bb-data = { path = "crates/bb-data" }
bb-strategies = { path = "crates/bb-strategies" }
bb-sim = { path = "crates/bb-sim" }
bb-forensics = { path = "crates/bb-forensics" }
bb-db = { path = "crates/bb-db" }
bb-artifacts = { path = "crates/bb-artifacts" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
zip = "6"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
httpdate = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
bb-analytics = { path = "crates/bb-analytics" }
# OpenAPI 3.1 generated from code (API_CONTRACT §11). `ToSchema` derives in bb-core and
# bb-analytics sit behind their optional `openapi` feature (attribute-only, no serde change).
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "request-id", "compression-gzip"] }
governor = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hmac = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
